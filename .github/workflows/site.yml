# Checks the site and, on main, puts it live. A push to main is the only way to deploy.
#
# What runs depends on what changed (job "changes"):
#   nothing under site/    the workflow does not start (see "paths" below)
#   content only           build, image metadata, internal links, deploy        target: live in 3 min
#   anything else          the same, plus type check and Lighthouse budget       target: live in 4 min
# First run, 16 Nov 2026, a code change with a cold image cache: every check done 2 min 22 s
# after the push.
# Content is a post, a post's pictures, the shelf, cover art, a photograph or a logo. Those cannot
# break the layout or the scripts, so they skip the two slow checks. Everything else under site/
# counts as code, the facts in src/data/site.ts included.
#
# The build that was checked is the build that is uploaded: "build" stores dist/ as an artifact,
# "budget" measures it and "deploy" uploads it. Nothing is built twice.
# Jobs run in parallel where they can; each pays about 20 s of setup, which is free on a public
# repository and costs no wall time.
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

# A newer push replaces a run that is still going: only the latest commit is worth deploying.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  WRANGLER: wrangler@4.105.0

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - id: kind
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # "code" unless every changed file under site/ is known content. Started by hand, a new
          # branch, a rewritten history or a very large change: no reliable list, so run it all.
          kind=code
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$BASE" ] && [ -z "${BASE##*[!0]*}" ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename') \
              && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ]; then
              site=$(printf '%s\n' "$files" | grep -E '^(site/|\.github/workflows/site\.yml$)' || true)
              other=$(printf '%s\n' "$site" | grep -vE '^site/(src/content/|src/data/shelf\.json$|src/assets/(covers|photos)/|public/logos/)' || true)
              [ -z "$other" ] && kind=content
              printf 'Changed under site/:\n%s\n' "$site"
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Change kind: **$kind**" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, images, links
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Before the build, so a photograph that still carries its GPS position never reaches dist/.
      - name: Image metadata
        run: npm run strip -- --check
      # Resized pictures from earlier runs. Without them the build encodes every image again
      # (about 50 s instead of 12 s).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/node_modules/.astro
          key: astro-images-${{ hashFiles('site/src/assets/**', 'site/src/content/**/img/**') }}
          restore-keys: astro-images-
      - run: npm run build
      - name: Internal links
        run: npm run links
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: site/dist
          retention-days: 3
          # Almost all of it is images, which do not compress further.
          compression-level: 0

  types:
    name: Type check
    needs: changes
    if: needs.changes.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check

  budget:
    name: Lighthouse budget
    needs: [changes, build]
    if: needs.changes.outputs.kind == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: site/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: site/dist
      # The same server "npm run preview" starts: it applies _headers, so the content security
      # policy is the production one and a script it blocks fails the budget here, not live.
      - name: Serve the build
        working-directory: site
        run: |
          npx --yes "$WRANGLER" pages dev dist --port 8788 --ip 127.0.0.1 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8788/ && exit 0; sleep 1; done
          echo "The preview server did not answer within 60 s:"; cat "$RUNNER_TEMP/preview.log"; exit 1
      - name: Measure
        working-directory: site
        run: node scripts/budget.mjs

  deploy:
    name: Deploy to leventaksakal.com
    needs: [changes, build, types, budget]
    # Skipped checks (a content change) count as passed; a failed or cancelled one stops the deploy.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.build.result == 'success'
      && (needs.types.result == 'success' || needs.types.result == 'skipped')
      && (needs.budget.result == 'success' || needs.budget.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://leventaksakal.com
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Nothing was deployed: the repository secret CLOUDFLARE_API_TOKEN or the variable CLOUDFLARE_ACCOUNT_ID is missing. README.md, section Deploy, says how to set them."
            exit 1
          fi
          npx --yes "$WRANGLER" pages deploy dist --project-name levent-website --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "${SUBJECT:-Started by hand}" | head -n 1)" --commit-dirty=true
