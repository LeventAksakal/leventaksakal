# Checks the site and, on main, puts it live. A push to main is the only way to deploy.
#
# A job runs only when a file it reads changed (job "changes"). The deploy runs only when the
# built site can differ:
#   nothing under site/, or only files no job reads     the workflow does not start ("paths" below)
#   content only                    build, image metadata, internal links, deploy   target: live in 3 min
#   other files that ship           the same, plus type check and Lighthouse budget target: live in 4 min
#   only a check's own script       the job that runs that script, no deploy
#   only this workflow              every check, no deploy
# "Ships" is src/, public/ and the build's settings (astro.config.mjs, package.json and its lock,
# tsconfig.json, wrangler.toml), and any file under site/ this list does not know: an unknown
# file is treated as code, never as nothing. Content is a post, a post's pictures, the shelf,
# cover art, a photograph or a logo. Those cannot break the layout or the scripts, so they skip
# the two slow checks; the facts in src/data/site.ts count as code.
# Files no job reads: Markdown in site/ itself, site/.gitignore, and the scripts that are only
# run by hand (covers.mjs, font.mjs).
# After changing the deploy job, start the workflow by hand (Actions, "Run workflow", or
# `gh workflow run site`): started by hand it runs everything and deploys.
# Measured 16 Nov 2026: a content push was live 50 s after the push; the checks of a code push
# were done after 1 min 50 s (2 min 22 s with a cold image cache) and the upload takes about 25 s.
#
# The build that was checked is the build that is uploaded: "build" stores dist/ as an artifact,
# "budget" measures it and "deploy" uploads it. Nothing is built twice.
# Jobs run in parallel where they can; each pays about 20 s of setup, which is free on a public
# repository and costs no wall time.
name: site

on:
  push:
    branches: [main]
    # Files no job reads do not start the workflow. Keep in step with "nothing" in the job "changes".
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '!site/*.md'
      - '!site/.gitignore'
      - '!site/scripts/covers.mjs'
      - '!site/scripts/font.mjs'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '!site/*.md'
      - '!site/.gitignore'
      - '!site/scripts/covers.mjs'
      - '!site/scripts/font.mjs'
  workflow_dispatch:

# A newer push replaces a run that is still going: only the latest commit is worth deploying.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  WRANGLER: wrangler@4.105.0

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      build: ${{ steps.plan.outputs.build }}
      types: ${{ steps.plan.outputs.types }}
      budget: ${{ steps.plan.outputs.budget }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Everything runs unless the list of changed files says less is enough. Started by hand,
          # a new branch, a rewritten history or a very large change: no reliable list, so run it all.
          build=true types=true budget=true deploy=true why='no list of changed files: everything runs'
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -n "$BASE" ] && [ -z "${BASE##*[!0]*}" ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename') \
              && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ]; then
              has() { printf '%s\n' "$files" | grep -qE "$1"; }
              # "nothing" is read by no job; "paths" above leaves the same files out.
              nothing='^site/([^/]*\.md|\.gitignore|scripts/(covers|font)\.mjs)$'
              tools='^site/scripts/(budget|links|strip)\.mjs$'
              content='^site/(src/content/|src/data/shelf\.json$|src/assets/(covers|photos)/|public/logos/)'
              # Whatever else is under site/ ships, a file this list has never seen included.
              ships=$(printf '%s\n' "$files" | grep -E '^site/' | grep -vE "$nothing" | grep -vE "$tools" || true)
              code=$(printf '%s\n' "$ships" | grep -vE "$content" || true)
              build=false types=false budget=false deploy=false why='nothing a job reads changed'
              if [ -n "$ships" ]; then build=true deploy=true why='content changed'; fi
              if [ -n "$code" ]; then types=true budget=true why='files that ship changed'; fi
              if has '^site/scripts/(links|strip)\.mjs$'; then build=true why="$why; a script of the build job changed"; fi
              if has '^site/scripts/budget\.mjs$'; then build=true budget=true why="$why; the budget script changed"; fi
              if has '^\.github/workflows/site\.yml$'; then build=true types=true budget=true why="$why; this workflow changed"; fi
              printf 'Changed files:\n%s\n' "$files"
            fi
          fi
          {
            echo "build=$build"
            echo "types=$types"
            echo "budget=$budget"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
          echo "Runs: build **$build**, type check **$types**, Lighthouse budget **$budget**, deploy **$deploy** ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, images, links
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Before the build, so a photograph that still carries its GPS position never reaches dist/.
      - name: Image metadata
        run: npm run strip -- --check
      # Resized pictures from earlier runs. Without them the build encodes every image again
      # (about 50 s instead of 12 s).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/node_modules/.astro
          key: astro-images-${{ hashFiles('site/src/assets/**', 'site/src/content/**/img/**') }}
          restore-keys: astro-images-
      - run: npm run build
      - name: Internal links
        run: npm run links
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: site/dist
          retention-days: 3
          # Almost all of it is images, which do not compress further.
          compression-level: 0

  types:
    name: Type check
    needs: changes
    if: needs.changes.outputs.types == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check

  budget:
    name: Lighthouse budget
    needs: [changes, build]
    if: needs.changes.outputs.budget == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: site/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: site/dist
      # The same server "npm run preview" starts: it applies _headers, so the content security
      # policy is the production one and a script it blocks fails the budget here, not live.
      - name: Serve the build
        working-directory: site
        run: |
          npx --yes "$WRANGLER" pages dev dist --port 8788 --ip 127.0.0.1 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8788/ && exit 0; sleep 1; done
          echo "The preview server did not answer within 60 s:"; cat "$RUNNER_TEMP/preview.log"; exit 1
      - name: Measure
        working-directory: site
        run: node scripts/budget.mjs

  deploy:
    name: Deploy to leventaksakal.com
    needs: [changes, build, types, budget]
    # Only when the built site can differ. Skipped checks (a content change) count as passed; a
    # failed or cancelled one stops the deploy.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.changes.outputs.deploy == 'true'
      && needs.build.result == 'success'
      && (needs.types.result == 'success' || needs.types.result == 'skipped')
      && (needs.budget.result == 'success' || needs.budget.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://leventaksakal.com
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Nothing was deployed: the repository secret CLOUDFLARE_API_TOKEN or the variable CLOUDFLARE_ACCOUNT_ID is missing. SITE.md, section Deploy, says how to set them."
            exit 1
          fi
          npx --yes "$WRANGLER" pages deploy dist --project-name levent-website --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "${SUBJECT:-Started by hand}" | head -n 1)" --commit-dirty=true
